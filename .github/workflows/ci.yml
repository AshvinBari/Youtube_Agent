name: Streamlit YouTube Agent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout Repo
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -------------------------
      # 2. Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -------------------------
      # 3. Install Dependencies
      # -------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit tavily-python

          # Optional: Install extra packages if needed
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # -------------------------
      # 4. Lint the code
      # -------------------------
      - name: Run Linter
        run: |
          pip install flake8
          flake8 . --count --statistics

      # -------------------------
      # 5. Test Streamlit App (Syntax Check)
      # -------------------------
      - name: Syntax Check
        run: |
          python -m py_compile app.py

      # -------------------------
      # 6. Optional: Run Streamlit App for sanity check
      # -------------------------
      - name: Run Streamlit App (Sanity Check)
        run: |
          streamlit run app.py --server.headless true &
          sleep 10
          echo "Streamlit app started successfully"
